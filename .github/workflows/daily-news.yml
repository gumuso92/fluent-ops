name: Gunluk haberler
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python daily_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "fluent-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/voa.json
          git diff --cached --quiet || (git commit -m "Gunluk haberler $(date +%F)" && git push)
