/* Layout: field-manual dossier. Sticky top bar, left rail on desktop, single column on phone. */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --sunk:#E3E8EA; --ink:#13202A; --muted:#5A6873; --line:#CED6DB;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB; --stamp:#B7791F; --stamp-soft:#F6EBD5;
  --good:#1E7A4C; --good-soft:#DCF0E4; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#172129; --sunk:#1D2932; --ink:#E6ECEF; --muted:#93A3AE; --line:#2B3943;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1E2C55; --stamp:#E3B260; --stamp-soft:#3A2E17;
  --good:#5FD39A; --good-soft:#123426; --bad:#FF8A7E; --bad-soft:#3D1A17; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --sunk:#1D2932; --ink:#E6ECEF; --muted:#93A3AE; --line:#2B3943;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1E2C55; --stamp:#E3B260; --stamp-soft:#3A2E17;
  --good:#5FD39A; --good-soft:#123426; --bad:#FF8A7E; --bad-soft:#3D1A17; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-display);font-size:15px;line-height:1.5;font-variation-settings:"wdth" 100}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.78em;letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;font-variation-settings:"wdth" 80;letter-spacing:-.01em}
h2{font-size:22px;font-weight:750;font-variation-settings:"wdth" 85}
h3{font-size:16px;font-weight:700}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0}
.brand b{font-size:20px;font-weight:800;font-variation-settings:"wdth" 70;letter-spacing:.01em}
.brand .mono{color:var(--stamp)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:600}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.search{margin-left:auto;min-width:0;flex:0 1 260px}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.wrap{max-width:1280px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.ready{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.stamp{background:var(--stamp-soft);border-color:transparent;color:var(--stamp)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.ops{counter-reset:op}
.op{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.op:first-of-type{border-top:0}
.op .n{font-family:var(--f-mono);font-weight:600;color:var(--stamp);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}

.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.plist{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.plist button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-weight:600}
.plist button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.level{margin-top:18px}
.level h3{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.topic{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.topic:hover{border-color:var(--accent)}

.topic span{min-width:0}

.audio{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.dlg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.line.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line .who{font-weight:700;font-size:13px;padding-top:2px}
.line .en{font-family:var(--f-read);font-size:17px;line-height:1.55}
.line .tr{font-size:13.5px;color:var(--muted);margin-top:3px}
.blind .line .en,.blind .line .tr{filter:blur(6px);user-select:none}
.blind .line.revealed .en,.blind .line.revealed .tr{filter:none}
.play{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;padding:0}

.play svg{width:14px;height:14px;fill:currentColor}
.dict{display:flex;gap:6px;margin-top:6px}

.diff{font-family:var(--f-read);font-size:15px;margin-top:5px}
.diff .ok{color:var(--good)} .diff .miss{color:var(--bad);text-decoration:underline wavy}
.reading p.en{font-family:var(--f-read);font-size:18px;line-height:1.7;max-width:68ch}
.reading p.tr{color:var(--muted);max-width:68ch;margin-top:4px}
.para{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.hook{font-size:13px;background:var(--stamp-soft);border-radius:7px;padding:7px 9px}
.q{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;margin-top:6px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
textarea,.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);min-height:44px}
textarea{min-height:110px;resize:vertical;font-family:var(--f-read);font-size:15px}
.fb{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:14.5px;white-space:normal}
.fb ul{margin:6px 0;padding-left:18px}
.drill{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cue{font-family:var(--f-mono);font-size:13px;color:var(--stamp)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:9px 12px;border-radius:12px;font-family:var(--f-read);font-size:15.5px}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.brief{border-left:3px solid var(--stamp);padding-left:12px}
.stampbox{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.14em;padding:2px 8px;border-radius:4px;transform:rotate(-2deg)}
/* vault */
.boxes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.boxes div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.boxes b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}

/* methods */
.methods{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

.gen{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.prog{width:100%;max-width:420px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;z-index:50}
.empty{padding:22px;text-align:center;color:var(--muted)}
@media (max-width:860px){

  .boxes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .search{flex-basis:100%;order:3}
  .top{position:static}
  .ltabs{top:env(safe-area-inset-top,0px)}
  .nav{flex-wrap:nowrap;overflow-x:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

"NVH-006": {
 objectives:["Bir titreşim/gürültü sorununu kaynak–yol–alıcı mantığıyla anlatmak","Bir karşı önlemi (countermeasure) gerekçesiyle önermek","Teknik olmayan birine sonucu sade dille özetlemek"],
 dialogues:[
  {title:"The 140 Hz boom", setting:"Haftalık NVH toplantısı. Proje yöneticisi Laura, CAE mühendisi Emre'ye müşteri şikâyetini soruyor.", lines:[
   {s:"Laura",en:"Emre, the test drivers keep reporting a booming noise at around eighty kilometres an hour. Do we know where it's coming from?",tr:"Emre, test sürücüleri saatte seksen kilometre civarında uğultulu bir ses bildirmeye devam ediyor. Nereden geldiğini biliyor muyuz?"},
   {s:"Emre",en:"We have a strong suspect. The noise peaks at about 140 hertz, and our model shows a roof panel mode right at that frequency.",tr:"Güçlü bir şüphelimiz var. Ses yaklaşık 140 hertz'te tepe yapıyor ve modelimiz tam o frekansta bir tavan paneli modu gösteriyor."},
   {s:"Laura",en:"So the roof is acting like a loudspeaker?",tr:"Yani tavan hoparlör gibi mi davranıyor?"},
   {s:"Emre",en:"Exactly. The road input travels through the body, excites the roof, and the panel radiates sound into the cabin.",tr:"Aynen. Yol girdisi gövde boyunca ilerliyor, tavanı tahrik ediyor ve panel kabine ses yayıyor."},
   {s:"Laura",en:"What are our options? I'd rather not add weight if we can avoid it.",tr:"Seçeneklerimiz neler? Mümkünse ağırlık eklememeyi tercih ederim."},
   {s:"Emre",en:"Understood. Damping pads would work, but they add mass. A stiffer roof bow would shift the mode away from the problem frequency.",tr:"Anlaşıldı. Sönümleme pedleri işe yarar ama kütle ekler. Daha rijit bir tavan traversi modu sorunlu frekanstan uzaklaştırır."},
   {s:"Laura",en:"How confident are you in that?",tr:"Bundan ne kadar eminsin?"},
   {s:"Emre",en:"Fairly confident. The model correlates well with the test data below two hundred hertz, but I'd like one more measurement to confirm.",tr:"Oldukça eminim. Model iki yüz hertz'in altında test verisiyle iyi korele oluyor ama doğrulamak için bir ölçüm daha istiyorum."}]},
  {title:"Asking the test team", setting:"Emre, test mühendisi Mark'tan ek ölçüm istiyor.", lines:[
   {s:"Emre",en:"Hi Mark, could you squeeze in a quick measurement on prototype four this week?",tr:"Selam Mark, bu hafta dördüncü prototipte kısa bir ölçüm sıkıştırabilir misin?"},
   {s:"Mark",en:"Possibly. What exactly do you need?",tr:"Olabilir. Tam olarak neye ihtiyacın var?"},
   {s:"Emre",en:"An operational deflection shape of the roof between 100 and 180 hertz, with accelerometers along the centre line.",tr:"Tavanın 100 ile 180 hertz arasında çalışma deformasyon şekli; orta hat boyunca ivmeölçerlerle."},
   {s:"Mark",en:"How many points are we talking about?",tr:"Kaç noktadan bahsediyoruz?"},
   {s:"Emre",en:"Twelve would be ideal. Eight is the minimum to see the shape clearly.",tr:"On iki ideal olur. Şekli net görmek için en az sekiz."},
   {s:"Mark",en:"I can do eight on Thursday. Twelve would push it to next week.",tr:"Perşembe sekiz yapabilirim. On iki, işi gelecek haftaya iter."},
   {s:"Emre",en:"Let's go with eight on Thursday, then. Speed matters more here.",tr:"O zaman perşembe sekizle gidelim. Burada hız daha önemli."},
   {s:"Mark",en:"Fine. Send me the point locations by tomorrow and I'll set it up.",tr:"Tamam. Nokta konumlarını yarına kadar gönder, kurulumu yaparım."}]},
  {title:"Explaining it to management", setting:"Emre, teknik olmayan direktör Ayşe Hanım'a kısa özet veriyor.", lines:[
   {s:"Ayşe",en:"Give me the short version. Is this a big problem?",tr:"Kısa versiyonunu ver. Büyük bir sorun mu?"},
   {s:"Emre",en:"It's noticeable, but it's fixable. Customers would hear a low hum on certain roads.",tr:"Fark ediliyor ama çözülebilir. Müşteriler bazı yollarda alçak bir uğultu duyar."},
   {s:"Ayşe",en:"And the fix?",tr:"Ya çözüm?"},
   {s:"Emre",en:"A small reinforcement in the roof structure. Think of tightening a drum skin so it stops ringing at that note.",tr:"Tavan yapısında küçük bir takviye. Bir davul derisini gerip o notada çınlamasını durdurmak gibi düşünün."},
   {s:"Ayşe",en:"Cost and timing?",tr:"Maliyet ve zaman?"},
   {s:"Emre",en:"Low cost, about two hundred grams of added mass, and we can confirm it in simulation within two weeks.",tr:"Düşük maliyet, yaklaşık iki yüz gram ek kütle; simülasyonda iki hafta içinde doğrulayabiliriz."},
   {s:"Ayşe",en:"Good. Put that in a one-page summary for Friday.",tr:"Güzel. Bunu cuma için tek sayfalık bir özete koy."}]}],
 reading:{title:"Source, path, receiver", paras:[
  {en:"Every noise and vibration problem can be described with three words: source, path and receiver. The source is whatever creates the energy, such as the road surface, the tyres or an electric motor. The path is the route that energy takes through bushings, mounts and the body structure. The receiver is the person in the seat who hears or feels the result.",tr:"Her gürültü ve titreşim sorunu üç kelimeyle tarif edilebilir: kaynak, yol ve alıcı. Kaynak, enerjiyi üreten şeydir; yol yüzeyi, lastikler veya bir elektrik motoru gibi. Yol, bu enerjinin burçlar, takozlar ve gövde yapısı üzerinden izlediği güzergâhtır. Alıcı ise sonucu duyan ya da hisseden koltuktaki kişidir."},
  {en:"Engineers rarely control the source completely, so most countermeasures target the path. Softer bushings isolate the body from the input. Stiffer attachment points reduce how much the body responds. Damping material removes energy from panels that would otherwise ring like the skin of a drum.",tr:"Mühendisler kaynağı nadiren tamamen kontrol edebilir, bu yüzden çoğu karşı önlem yolu hedefler. Daha yumuşak burçlar gövdeyi girdiden izole eder. Daha rijit bağlantı noktaları gövdenin ne kadar tepki verdiğini azaltır. Sönümleme malzemesi, aksi hâlde davul derisi gibi çınlayacak panellerden enerjiyi alır."},
  {en:"Each option has a cost. Mass is the enemy of range in an electric vehicle, so a good NVH engineer always asks whether a stiffness change can do the job of a heavy damping pad. Simulation lets the team compare these options before a single part is built.",tr:"Her seçeneğin bir bedeli var. Elektrikli araçta kütle menzilin düşmanıdır; bu yüzden iyi bir NVH mühendisi her zaman bir rijitlik değişikliğinin ağır bir sönümleme pedinin işini görüp göremeyeceğini sorar. Simülasyon, ekibin tek bir parça üretilmeden bu seçenekleri karşılaştırmasını sağlar."}]},

  {w:"countermeasure",ipa:"/ˈkaʊntəˌmeʒə/",pos:"n",tr:"karşı önlem",ex:"We tested three countermeasures in the model.",exTr:"Modelde üç karşı önlem test ettik."},
  {w:"stiffness",ipa:"/ˈstɪfnəs/",pos:"n",tr:"rijitlik",ex:"Higher stiffness shifts the mode upwards.",exTr:"Daha yüksek rijitlik modu yukarı kaydırır."},
  {w:"damping",ipa:"/ˈdæmpɪŋ/",pos:"n",tr:"sönümleme",ex:"Damping reduces the peak but not the frequency.",exTr:"Sönümleme tepeyi azaltır ama frekansı değiştirmez."},
  {w:"to correlate",ipa:"/ˈkɒrəleɪt/",pos:"v",tr:"korele olmak, örtüşmek",ex:"The simulation correlates well with the test.",exTr:"Simülasyon testle iyi örtüşüyor."},
  {w:"bushing",ipa:"/ˈbʊʃɪŋ/",pos:"n",tr:"burç",ex:"A softer bushing improves isolation.",exTr:"Daha yumuşak bir burç izolasyonu iyileştirir."},
  {w:"attachment point",ipa:"/əˈtætʃmənt pɔɪnt/",pos:"n",tr:"bağlantı noktası",ex:"Check the dynamic stiffness at each attachment point.",exTr:"Her bağlantı noktasındaki dinamik rijitliği kontrol et."},
  {w:"to shift (a frequency)",ipa:"/ʃɪft/",pos:"v",tr:"(frekansı) kaydırmak",ex:"The reinforcement shifts the mode by 15 Hz.",exTr:"Takviye modu 15 Hz kaydırıyor."},
  {w:"operational deflection shape",ipa:"/ˌɒpəˈreɪʃənl dɪˈflekʃn ʃeɪp/",pos:"n",tr:"çalışma deformasyon şekli (ODS)",ex:"The ODS confirmed the roof was moving.",exTr:"ODS tavanın hareket ettiğini doğruladı."},
  {w:"trade-off",ipa:"/ˈtreɪd ɒf/",pos:"n",tr:"ödünleşim",ex:"There is a trade-off between mass and comfort.",exTr:"Kütle ile konfor arasında bir ödünleşim var."}],

 grammar:{point:"Hedging: confidence levels", tr:"Teknik iletişimde kesinlik derecesini ayarlamak güven verir. 'Definitely → very likely → fairly confident → it might → I can't rule out' sırasıyla kesinlik azalır. Abartılı kesinlik toplantıda sizi savunmasız bırakır.", examples:["I'm fairly confident the mode is the root cause.","It's very likely that the bushing is too stiff.","I can't rule out a contribution from the door seals.","The data suggests the path goes through the rear subframe."]},

 objectives:["Otele giriş yaparken rezervasyonu teyit etmek","Oda tercihleri ve olanaklar hakkında soru sormak","Bir sorunu kibarca dile getirmek"],
 dialogues:[
  {title:"At reception", setting:"Lizbon'da bir otel. Gece 22:00.", lines:[
   {s:"Receptionist",en:"Good evening, welcome to the Alfama Hotel. Do you have a reservation?",tr:"İyi akşamlar, Alfama Otel'e hoş geldiniz. Rezervasyonunuz var mı?"},
   {s:"Ömer",en:"Good evening. Yes, it's under Gümüş, for three nights.",tr:"İyi akşamlar. Evet, Gümüş adına, üç gece."},
   {s:"Receptionist",en:"Let me check… Yes, a double room until Sunday. May I see your passport, please?",tr:"Bir bakayım… Evet, pazara kadar çift kişilik oda. Pasaportunuzu görebilir miyim lütfen?"},
   {s:"Ömer",en:"Here you are. Is breakfast included?",tr:"Buyurun. Kahvaltı dahil mi?"},
   {s:"Receptionist",en:"It is. Breakfast is served from seven to ten on the ground floor.",tr:"Dahil. Kahvaltı zemin katta yediden ona kadar servis ediliyor."},
   {s:"Ömer",en:"Great. Would it be possible to have a quiet room, away from the street?",tr:"Harika. Caddeden uzak, sessiz bir oda mümkün mü?"},
   {s:"Receptionist",en:"Certainly. I'll put you on the fourth floor, facing the courtyard.",tr:"Elbette. Sizi avluya bakan dördüncü kata alıyorum."},
   {s:"Ömer",en:"Perfect, thank you. And what's the Wi-Fi password?",tr:"Mükemmel, teşekkürler. Wi-Fi şifresi nedir?"},
   {s:"Receptionist",en:"It's on the card with your key. Enjoy your stay!",tr:"Anahtarınızla birlikte verdiğim kartta yazıyor. İyi konaklamalar!"}]},
  {title:"A problem with the room", setting:"Ömer odadan resepsiyonu arıyor.", lines:[

   {s:"Ömer",en:"Hi, this is room 412. I'm afraid the air conditioning isn't working.",tr:"Merhaba, 412 numaralı oda. Maalesef klima çalışmıyor."},
   {s:"Receptionist",en:"I'm sorry to hear that. Have you tried the switch next to the door?",tr:"Bunu duyduğuma üzüldüm. Kapının yanındaki düğmeyi denediniz mi?"},
   {s:"Ömer",en:"Yes, I have. The display turns on, but no air comes out.",tr:"Evet, denedim. Ekran açılıyor ama hava gelmiyor."},
   {s:"Receptionist",en:"I'll send someone up right away. If it can't be fixed, we'll move you to another room.",tr:"Hemen birini gönderiyorum. Tamir edilemezse sizi başka bir odaya alırız."},
   {s:"Ömer",en:"Thank you, I appreciate it.",tr:"Teşekkürler, minnettarım."}]},
  {title:"Checking out", setting:"Pazar sabahı.", lines:[

const TRW=[[/İngilizcesini/g,"Fransızcasını"],[/İngilizcesi/g,"Fransızcası"],[/İngilizceye/g,"Fransızcaya"],[/İngilizcede/g,"Fransızcada"],[/İngilizce/g,"Fransızca"]];
function frUI(root){if(window.FO_LANG!=="fr"||!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=tw.nextNode())){if(n.nodeValue.includes("İngilizce")){let v=n.nodeValue;TRW.forEach(([a,b])=>v=v.replace(a,b));n.nodeValue=v}}
  root.querySelectorAll("[placeholder],[aria-label]").forEach(e=>["placeholder","aria-label"].forEach(at=>{const v=e.getAttribute(at);if(v&&v.includes("İngilizce")){let t=v;TRW.forEach(([a,b])=>t=t.replace(a,b));e.setAttribute(at,t)}}))}

/* ---------- speech ---------- */
const TTS={voices:[],ok:"speechSynthesis" in window,
  load(){if(!this.ok)return;this.voices=speechSynthesis.getVoices().filter(v=>/^(en|fr)/i.test(v.lang))},
  pick(accent,i){const lg=accent.slice(0,2);const list=this.voices.filter(v=>v.lang.replace("_","-").startsWith(accent));const same=this.voices.filter(v=>v.lang.slice(0,2).toLowerCase()===lg);const pool=list.length?list:same.length?same:this.voices;return pool.length?pool[i%pool.length]:null},
  speak(text,{rate=1,accent="en-US",vi=0,pitch=1}={}){if(window.FO_LANG==="fr")accent="fr-FR";else if(/^fr/.test(accent))accent="en-US";return new Promise(res=>{if(!this.ok){res();return}const u=new SpeechSynthesisUtterance(text);u.lang=accent;const v=this.pick(accent,vi);if(v)u.voice=v;u.rate=rate;u.pitch=pitch;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})},
  stop(){if(this.ok)speechSynthesis.cancel()}};
if(TTS.ok){TTS.load();speechSynthesis.onvoiceschanged=()=>TTS.load()}

function speakerVoice(L,dlg,s){const names=[...new Set(dlg.lines.map(l=>l.s))];const i=names.indexOf(s);const kidsPitch=L.kids&&i%2===1?1.25:1;return{vi:i,pitch:TTS.voices.length<2?(i%2?1.2:.9)*kidsPitch:kidsPitch}}

  <select id="rate" aria-label="Hız">${[.6,.75,.9,1,1.15,1.3].map(x=>`<option value="${x}" ${x==r?"selected":""}>${x}×</option>`).join("")}</select>
  <div class="seg" role="group" aria-label="Aksan">${[["en-US","US"],["en-GB","UK"]].map(([k,n])=>`<button data-acc="${k}" aria-pressed="${P.settings.accent===k}">${n}</button>`).join("")}</div>
  <div class="seg"><button id="trT" aria-pressed="${P.settings.tr}">TR</button></div>${extra}</div>`}
function bindAudioBar(el,rerender){
  $$("[data-mode]",el).forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;TTS.stop();playToken++;rerender()});
  $("#rate",el).onchange=e=>{P.settings.rate=+e.target.value;saveP()};
  $$("[data-acc]",el).forEach(b=>b.onclick=()=>{P.settings.accent=b.dataset.acc;saveP();rerender()});
  $("#trT",el).onclick=()=>{P.settings.tr=!P.settings.tr;saveP();rerender()};
}

const norm=w=>w.toLowerCase().replace(/[^a-z0-9']/g,"");
function diff(ref,typed){const t=typed.split(/\s+/).map(norm).filter(Boolean);const pool=[...t];let ok=0;const words=ref.split(/\s+/).map(w=>{const n=norm(w);const j=pool.indexOf(n);if(n&&j>=0){pool.splice(j,1);ok++;return`<span class="ok">${esc(w)}</span>`}return`<span class="miss">${esc(w)}</span>`});
  const pct=Math.round(ok/Math.max(1,ref.split(/\s+/).length)*100);return`<div>${words.join(" ")}</div><div class="mono muted">${pct}% eşleşme</div>`}

function renderVault(){
  const cards=Object.values(SRS.cards);const boxes=BOX_DAYS.map((_,b)=>cards.filter(c=>c.box===b).length);
  if(!V.queue)V.queue=dueCards().sort(()=>Math.random()-.5);
  const c=V.queue[V.i];
  app.className="wrap";
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:end"><div><span class="eyebrow">Aralıklı tekrar · Leitner kutuları</span><h1>Kelime Kasası</h1></div>
    <div class="seg" role="group" aria-label="Yön"><button data-dir="en" aria-pressed="${V.dir==="en"}">EN → TR</button><button data-dir="tr" aria-pressed="${V.dir==="tr"}">TR → EN (zor)</button></div></div>
  <div class="boxes" style="margin:14px 0">${boxes.map((n,b)=>`<div><span class="eyebrow">Kutu ${b}</span><b>${n}</b><span class="note">${BOX_DAYS[b]?BOX_DAYS[b]+" gün":"bugün"}</span></div>`).join("")}</div>
  <div class="card flash" id="flash">${!cards.length?`<p class="muted">Kasa boş. Bir dersin Kelimeler sekmesinden kelime ekle.</p><button class="btn primary" id="toCur">Müfredata git</button>`:
    !c?`<span class="stampbox">TAMAM</span><h2>Bugünlük tekrar bitti</h2><p class="muted">Yarın vadesi gelecek: ${cards.filter(x=>x.due===addDays(today(),1)).length} kart</p>`:
    `<span class="eyebrow">${V.i+1} / ${V.queue.length} · Kutu ${c.box}</span>
     <div class="big">${esc(V.dir==="en"?c.w:c.tr)}</div>${V.dir==="en"&&c.ipa?`<span class="mono muted">${esc(c.ipa)}</span>`:""}
     ${V.flip?`<div><b style="font-size:20px">${esc(V.dir==="en"?c.tr:c.w)}</b>${c.ex?`<p style="font-family:var(--f-read);margin-top:6px">${esc(c.ex)}</p>`:""}<p class="note mono">${esc(c.lesson||"")}</p></div>
       <div class="row"><button class="btn" data-g="0">Bilemedim</button><button class="btn" data-g="1">Zor</button><button class="btn primary" data-g="2">Bildim</button></div>`:
       `<p class="note">Önce cevabı zihninde söyle, sonra çevir.</p><div class="row"><button class="btn primary" id="flip">Çevir</button><button class="play" id="sayC" aria-label="Dinle">${PLAY}</button></div>`}`}</div>
  ${cards.length?`<details style="margin-top:16px"><summary class="note">Tüm kartlar (${cards.length})</summary><div class="topics" style="margin-top:8px">${cards.slice(0,400).map(x=>`<div class="topic" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(x.w)}</b> <span class="note">${esc(x.tr)}</span></span><span class="chip">K${x.box} · ${esc(x.due.slice(5))}</span></div>`).join("")}</div></details>`:""}`;
  app.onclick=null;
  $$("[data-dir]").forEach(b=>b.onclick=()=>{V.dir=b.dataset.dir;V.flip=false;renderVault()});
  const tc=$("#toCur");if(tc)tc.onclick=()=>go("cur");
  const f=$("#flip");if(f)f.onclick=()=>{V.flip=true;renderVault();if(V.dir==="tr"&&c)TTS.speak(c.w,{rate:.9,accent:P.settings.accent})};
  const sc=$("#sayC");if(sc)sc.onclick=()=>TTS.speak(c.w,{rate:.9,accent:P.settings.accent});
  $$("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;const card=SRS.cards[norm(c.w).slice(0,60)]||c;
    if(g===2){card.box=Math.min(6,card.box+1);card.due=addDays(today(),BOX_DAYS[card.box])}else if(g===1){card.due=addDays(today(),1)}else{card.box=0;card.due=today();V.queue.push(card)}
    saveS();activity(1);V.i++;V.flip=false;renderVault()});
}

/* ---------- methods ---------- */
const METHODS=[
 ["Gölgeleme (Shadowing)","Poliglot Alexander Argüelles'in yaygınlaştırdığı teknik: ana dili konuşanın sesini dinlerken neredeyse eş zamanlı, aynı ritim ve tonlamayla tekrar etmek. Kulak ile ağız kasları arasında bağlantı kurar; vurgu ve bağlantılı konuşma (linking) otomatikleşir.","Diyaloglar → Gölgeleme modu. Her replikten sonra konuşma süresi kadar sessizlik bırakılır. Önce 0.75×, sonra 1×."],
 ["Aralıklı tekrar (Spaced repetition)","Ebbinghaus'un unutma eğrisi: bilgi tekrar edilmezse hızla kaybolur, doğru aralıklarla hatırlandığında kalıcılaşır. Leitner kutu sistemi bunu basit kurallara çevirir: bildiğin kart ileri kutuya geçer ve daha seyrek gelir.","Kelime Kasası: 7 kutu, 0–1–2–4–8–16–32 gün. TR → EN yönü daha zordur ve üretimi güçlendirir."],
 ["Aktif hatırlama (Retrieval practice)","Bilgiyi tekrar okumak yerine hafızadan çağırmak, öğrenme araştırmalarında en tutarlı etkiye sahip yöntemlerden biridir. Zorlanmak işin parçasıdır.","Okuma → Blurting: metni kapat, aklında kalanı yaz; Claude eksikleri ve hataları gösterir."],
 ["Geri çeviri (Back-translation)","Rönesans öğretmeni Roger Ascham'ın önerdiği, Benjamin Franklin'in yazısını geliştirmek için kullandığı yöntem: metni çevir, bekle, kendi dilinden geri çevir ve orijinalle karşılaştır. Aradaki farklar doğal kalıpları gösterir.","Drill → Geri çeviri: diyalogdaki Türkçe cümleyi İngilizceye kur, kelime kelime karşılaştır."],
 ["Kalıp drill'leri (Pattern drills)","ABD Dışişleri Bakanlığı'nın dil okulu FSI'ın klasik ders kitaplarında kullanılan yerine koyma ve dönüştürme alıştırmaları. Amaç yapıyı bilinçli kural düşünmeden, refleks olarak kurmak.","Drill sekmesi: model cümle + ipucu → yeni cümle. Hızlı ve sesli yap, sonra yazıp kontrol et."],
 ["Kalıp ifadeler (Lexical chunks)","Michael Lewis'in sözcüksel yaklaşımı: akıcı konuşmacılar tek tek kelimeyle değil hazır ifade bloklarıyla konuşur ('I'd rather not…', 'How confident are you…'). Blok öğrenmek gramer hatasını da azaltır.","Brifing → Kalıp ifadeler. Kalıpları kasaya ekleyip kart olarak çalış."],
 ["Anlaşılır girdi (Comprehensible input)","Stephen Krashen'in hipotezi: dil, seviyenin biraz üstündeki ama anlaşılabilen bol girdiyle edinilir. Bu yüzden her ders Türkçe destekli; zamanla TR'yi kapat.","TR düğmesi: önce açık, ikinci dinlemede kapalı. Kör dinleme modu en zor seviyedir."],
 ["Görev temelli öğrenme (Task-based)","Askeri ve diplomatik dil okullarında (örn. DLI, FSI) dil, gerçek görevler etrafında çalışılır: bilgi topla, ikna et, uzlaş. Dikkat dile değil göreve verildiğinde konuşma daha doğal hâle gelir.","Görev sekmesi: brifing, gizli bilgi içeren karakter, başarı ölçütü ve görev sonu değerlendirme."],
 ["Bilgi çıkarma soruları (Elicitation)","Mülakatçıların ve sahada çalışanların temel becerisi: açık uçlu sorular, yansıtma ('So you're saying…'), sessizliğe izin verme. Dil öğreniminde konuşmayı yönetme ve dinleme becerisini birlikte geliştirir.","Her görev karakterinde yalnızca iyi sorulara açılan bir bilgi vardır. What / How / Why ile başla."],
 ["Anahtar kelime yöntemi (Keyword mnemonic)","Atkinson'un 1970'lerde test ettiği teknik: yeni kelimenin sesini ana dildeki benzer bir kelimeye bağlayıp canlı bir imge kurmak. Hafıza sporcularının 'hafıza sarayı' tekniğiyle aynı aileden.","Kelimeler → Hafıza çengeli: Claude Türkçe sesli bir bağ ve abartılı bir imge cümlesi önerir."],
 ["Dikte (Dictation)","Dinlediğini yazmak, kulağın hangi sesleri kaçırdığını ölçülebilir hâle getirir: zayıf heceler, bağlantılı sesler, artikeller.","Diyaloglar → Dikte modu: yaz, kontrol et; kaçan kelimeler kırmızı ve yüzde skorla gelir."],
 ["Minimal çiftler (Minimal pairs)","Tek ses farkıyla ayrılan kelime çiftleri (ship / sheep). Türkçede olmayan /θ/, /ð/, /w/, /æ/ ve uzun–kısa ünlü farkı için hedefli kulak eğitimi.","Telaffuz sekmesi: çiftleri arka arkaya dinle, farkı abartarak taklit et."],
 ["Serpiştirme (Interleaving)","Tek konuyu bloklar hâlinde çalışmak yerine farklı beceri ve konuları karıştırmak, transferi güçlendirir. Günlük plan bu yüzden dört farklı etkinlikten oluşur.","Komuta → Günlük operasyon: tekrar, gölgeleme, yeni ders, görev; toplam ~25 dakika."]
];
function renderSettings(){app.onclick=null;const g=P.settings.gemini||{};const inClaude=!!(window.claude&&window.claude.use)&&sample&&sample.provider!=="gemini";
  app.innerHTML=`<span class="eyebrow">Ayarlar</span><h1>Bağlantı ve yedek</h1>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">
   <section class="card"><h2>Yapay zekâ (isteğe bağlı)</h2>
    <p class="note" style="margin:6px 0 10px">Dersler ve tüm alıştırmalar yapay zekâ olmadan çalışır. Yalnızca Görev konuşması, yazı değerlendirme, hafıza çengeli ve listede olmayan yeni konu yazdırma için gerekir.
    ${inClaude?"<b>Şu an Claude üzerinden bağlısın.</b>":"Bu dosya claude.ai dışında açıldığında ücretsiz bir Google Gemini API anahtarı kullanabilir (aistudio.google.com → Get API key)."}</p>
    <label class="note" for="gk">Gemini API anahtarı</label><input class="field" id="gk" type="password" autocomplete="off" value="${esc(g.key||"")}" placeholder="AIza…">
    <label class="note" for="gm" style="display:block;margin-top:8px">Model</label><input class="field" id="gm" value="${esc(g.model||"gemini-flash-latest")}">
    <div class="row" style="margin-top:10px"><button class="btn primary" id="gs">Kaydet ve dene</button><button class="btn ghost" id="gx">Anahtarı sil</button><span class="note" id="gmsg"></span></div>
    <p class="note" style="margin-top:8px">Anahtar yalnızca bu tarayıcıda saklanır ve doğrudan Google'a gönderilir.</p></section>
   <section class="card"><h2>İlerleme yedeği</h2>${PKG?`<p class="note" style="margin:6px 0 0"><b>Cihazlar arası eşitleme:</b> Çeviriden Öğren → “Kayıt & Drive” bağlıyken iki kolun ilerlemesi birlikte Google Drive’a yazılır.</p>`:""}<p class="note" style="margin:6px 0 10px">Tamamlanan dersler, skorlar ve kelime kasası. Başka bir bilgisayara taşımak için metni kopyala, orada "Yükle" ile yapıştır.</p>
    <div class="row"><button class="btn" id="bx">Yedeği göster</button><button class="btn" id="bi">Yükle</button><span class="note" id="bmsg"></span></div>
    <textarea id="bt" style="margin-top:10px;font-family:var(--f-mono);font-size:12px" placeholder="Yedek metni burada görünür ya da buraya yapıştırılır"></textarea></section></div>`;
  $("#gs").onclick=async()=>{P.settings.gemini={key:$("#gk").value.trim(),model:$("#gm").value.trim()||"gemini-flash-latest"};saveP();const m=$("#gmsg");
    if(!P.settings.gemini.key){m.textContent="Anahtar boş.";return}const prev=sample;sample=SX(geminiAdapter(P.settings.gemini.key,P.settings.gemini.model));m.textContent="Deneniyor…";
    try{await sample("Reply with the single word OK.");sampleState="ok";m.textContent="Bağlantı çalışıyor."}catch(e){m.textContent=errCopy(e);if(prev&&prev.provider!=="gemini")sample=prev}};
  $("#gx").onclick=()=>{delete P.settings.gemini;saveP();if(sample&&sample.provider==="gemini"){sample=null;sampleState="none"}renderSettings()};
  $("#bx").onclick=()=>{$("#bt").value=JSON.stringify({v:1,progress:P,srs:SRS});$("#bt").select();try{navigator.clipboard.writeText($("#bt").value).then(()=>$("#bmsg").textContent="Panoya kopyalandı.",()=>{})}catch(e){}};
  $("#bi").onclick=()=>{try{const j=JSON.parse($("#bt").value);if(!j.progress||!j.srs)throw 0;P={...P,...j.progress};SRS=j.srs;saveP();saveS();$("#bmsg").textContent="Yedek yüklendi."}catch(e){$("#bmsg").textContent="Metin geçerli bir yedek değil."}};
}
function renderMethods(){app.className="wrap";app.onclick=null;
  app.innerHTML=`<span class="eyebrow">Saha el kitabı</span><h1>Yöntemler</h1><p class="muted" style="max-width:70ch;margin:6px 0 16px">Bu platform, çok dil konuşanların ve devlet dil okullarının kullandığı tekniklerin her derse yerleştirilmiş hâlidir. Her kart yöntemin özünü ve platformda nerede uygulandığını gösterir.</p>
  <div class="grid methods">${METHODS.map(([t,d,h])=>`<div class="card method"><h3>${esc(t)}</h3><p class="note" style="color:var(--ink)">${esc(d)}</p><p class="how"><span class="eyebrow">Platformda</span><br>${esc(h)}</p></div>`).join("")}</div>`}

/* ---------- boot ---------- */
async function boot(){
  const stored=LS.get("progress");if(stored)P={...P,...stored,settings:{...P.settings,...(stored.settings||{})}};
  const ss=LS.get("srs");if(ss)SRS=ss;
  if(!PROGRAMS[P.focus])P.focus="MEC";
  const h=(location.hash||"").slice(1);if(h&&L_(h)){S.view="lesson";S.lesson=h}else if(["cur","vault","methods","settings"].includes(h))S.view=h;
  render();
  if(!BUNDLE&&!PKG)fetch("data/index.json").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ids){READY=new Set(j.ids);if(S.view!=="lesson")render()}}).catch(()=>{});
  if(!window.claude||!window.claude.use){if(!useGemini())sampleState="none";render();return}
  claude.use("sample").then(s=>{sample=SX(s);sampleState=s?"ok":"none";if(S.view==="lesson")renderLesson()}).catch(()=>{sampleState="none"});
  try{const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);const uid=user?await user.id():null;
    if(db&&uid){Store.db=db;Store.uid=uid;const [p,s]=await Promise.all([Store.get("progress"),Store.get("srs")]);
      if(p)P={...P,...p,settings:{...P.settings,...(p.settings||{})}};else if(stored)saveP();if(!PROGRAMS[P.focus])P.focus="MEC";
      if(s&&s.cards)SRS=s;else if(ss)saveS();
      if(S.view!=="lesson")render()}}catch(e){}
}
boot();
})();

</script>
