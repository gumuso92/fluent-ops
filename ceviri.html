*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.55 var(--f-display);padding-bottom:env(safe-area-inset-bottom)}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.toolbar{margin:14px 0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.sidebar{max-height:78vh;overflow:auto;position:sticky;top:64px}
.search{width:100%;margin-bottom:10px}
.article{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;padding:9px 10px;margin:2px 0;cursor:pointer;color:var(--ink)}
.article:hover,.article.active{background:var(--blue-soft);border-color:transparent}
.article small{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.badge{display:inline-block;border-radius:5px;padding:2px 7px;background:var(--sunk);color:var(--muted);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 4px 4px 0}

.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.reader h2{margin:0 0 6px;font-size:22px;font-weight:750;font-variation-settings:"wdth" 85;text-wrap:balance}
.sentence{padding:12px 14px;border-radius:10px;border:1px solid var(--line);margin:8px 0;background:var(--card);cursor:pointer}
.sentence:hover{border-color:var(--blue)}.sentence.speaking{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.num{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-right:8px}
.source{font-family:var(--f-read);font-size:17.5px;line-height:1.6}
.translation{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:14.5px}
.hidden{display:none!important}
mark{border-radius:4px;padding:0 3px;color:inherit}
.hl-topic{background:#dbeafe;color:#1d4ed8}.hl-term{background:#f3e8ff;color:#6b21a8}.hl-verb{background:#dcfce7;color:#166534}.hl-link{background:#fef3c7;color:#92400e}
.hl-acad{background:#ffe4e6;color:#9f1239;border-bottom:2px dotted #e11d48;cursor:help}

.legend span{padding:2px 8px;border-radius:5px;margin-right:5px;display:inline-block;margin-bottom:4px;font-size:12px}

.result{margin-top:12px;border-radius:10px;padding:13px;background:var(--sunk);border:0}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.good{color:var(--green)}.bad{color:var(--red)}
.tok-ok{background:var(--green-soft);color:var(--green);border-radius:4px;padding:0 2px}.tok-miss{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 2px}
.tabs{display:flex;gap:2px;margin-bottom:14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{white-space:nowrap;border:0!important;border-radius:0!important;background:none!important;color:var(--muted)!important;border-bottom:2px solid transparent!important;padding:9px 12px!important}
.tab.active{color:var(--ink)!important;border-bottom-color:var(--blue)!important}
.progress{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--green)}
.note{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.donebar{position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:50;max-width:90vw;font-weight:600}
.info{background:var(--stamp-soft);border:0;border-radius:8px;padding:10px 12px;color:var(--ink);font-size:13px;margin:8px 0}
.wordlist{display:flex;flex-wrap:wrap;gap:6px}.wordlist span{background:var(--red-soft);color:var(--red);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer}
code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-family:var(--f-mono);font-size:.85em}
ol li{margin-bottom:5px}

.translation .al{font-family:var(--f-read)}

.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}

tr:["Elektrikli araçlar, içten yanmalı motorlu araçlara göre çok daha sessizdir.","Ancak motor sesi ortadan kalktığında başka sesler daha belirgin hâle gelir.","Lastik ve yol gürültüsü, özellikle yüksek hızlarda sürücünün dikkatini çeker.","Rüzgâr sesi de aynalar ve kapı contaları çevresinde duyulabilir.","Bu nedenle mühendisler araç tasarımının erken aşamasında NVH analizleri yapar.","Sonlu elemanlar modelleri, gövdenin hangi frekanslarda titreştiğini gösterebilir.","Bazı problemler fiziksel prototip üretilmeden önce çözülebilir.","Yine de simülasyon sonuçlarının test verileriyle doğrulanması gerekir.","Yalıtım malzemeleri sesi azaltır, fakat aracın ağırlığını ve maliyetini artırabilir.","Sonuç olarak iyi bir tasarım, konfor, menzil ve maliyet arasında denge kurar."],
en:["Electric vehicles are much quieter than vehicles with internal combustion engines.","However, when engine noise disappears, other sounds become more noticeable.","Tyre and road noise attract the driver's attention, especially at high speeds.","Wind noise can also be heard around the mirrors and door seals.","Therefore, engineers carry out NVH analyses at an early stage of vehicle design.","Finite element models can show at which frequencies the body vibrates.","Some problems can be solved before a physical prototype is built.","Even so, simulation results need to be validated with test data.","Insulation materials reduce noise, but they can increase the vehicle's weight and cost.","In conclusion, a good design strikes a balance between comfort, range and cost."]}];
function buildCorpus(){
  const out=[];const byKey=Object.fromEntries(TOPICS.map(t=>[t.key,t]));
  SEEDS.forEach(s=>out.push({...s,al:s.tr.map(x=>mkAl(x,null)),topic:byKey[s.topicKey].tr,origin:"Elle yazılmış özgün metin",col:"gen"}));
  let i=0;
  while(out.length<1000){
    const topic=TOPICS[i%TOPICS.length],level=1+Math.floor(i/TOPICS.length)%3,variant=Math.floor(i/(TOPICS.length*3));
    const L=LEVELS[level],span=L.max-L.min+1,n=L.min+((variant*7+i*3)%span);
    const frames=FRAMES[level],tr=[],en=[],al=[];
    for(let j=0;j<n;j++){
      const f=frames[(j+variant*3)%frames.length],k=Math.floor((j+variant*3)/frames.length);
      const a=topic.terms[(j+k+variant)%6],b=topic.terms[(j+k+variant+2)%6];
      tr.push(fill(f[0],"tr",topic,a,b));en.push(fill(f[1],"en",topic,a,b));al.push(mkAl(f[0],topic,a,b));
    }
    const tt=TITLES[level][variant%4].replace("{T}",topic.tr);
    out.push({id:`g-${topic.key}-${level}-${variant}`,topicKey:topic.key,topic:topic.tr,level,title:`${tt} · ${variant+1}`,tr,en,al,origin:"Özgün, şablonla üretilmiş çalışma metni",col:"gen"});
    i++;
  }
  return out;
}

function parseAl(s){const out=[];const re=/\[(\d+)\|?([^\]]*)\]|([^\[]+)/g;let m;while((m=re.exec(s)))out.push(m[1]?[m[2],+m[1]]:[m[3],0]);return out}
function fillNC(t,lang,topic,a,b){if(!topic)return t;const T=lang==="tr"?topic.tr.toLocaleLowerCase("tr"):topic.en;const A=lang==="tr"?a[0]:a[1],B=lang==="tr"?b[0]:b[1];return t.replace(/\{T\}/g,T).replace(/\{A\}/g,A).replace(/\{B\}/g,B)}
function mkAl(key,topic,a,b){const P=ALIGN[key];if(!P)return null;const side=(s,lang)=>{const segs=parseAl(s).map(([t,k])=>[fillNC(t,lang,topic,a,b),k]);if(segs.length&&segs[0][0])segs[0][0]=cap(segs[0][0],lang==="tr"?"tr":"en");return segs};return{tr:side(P[0],"tr"),en:side(P[1],"en")}}

const LS_KEY="ceviridenOgren.v2";
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
function emptyState(){return {schema:2,updatedAt:0,items:{},days:{},customTexts:[],settings:{rate:0.85},ext:null}}
function foSnap(){try{const ts=+(localStorage.getItem('fo:ts')||0);if(!ts)return null;return {p:JSON.parse(localStorage.getItem('fo:progress')||'null'),s:JSON.parse(localStorage.getItem('fo:srs')||'null'),ts}}catch(e){return null}}
function foApply(){const loc=foSnap(),rem=state.ext;if(rem&&rem.ts>(loc?loc.ts:0)){try{if(rem.p)localStorage.setItem('fo:progress',JSON.stringify(rem.p));if(rem.s)localStorage.setItem('fo:srs',JSON.stringify(rem.s));localStorage.setItem('fo:ts',String(rem.ts))}catch(e){}}else if(loc)state.ext=loc}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.schema===2)return s}catch(e){}return emptyState()}

const ALL_TOPICS=[...TOPICS,...ACAD_FIELDS];
const LINKS=["however","therefore","moreover","consequently","although","because","but","unless","whether","still","even so","nevertheless","furthermore","whereas","thus","hence","on the other hand","by contrast","as a result","in short","in conclusion","for example","for instance","in this context","in particular","that is why","when","ancak","fakat","ama","bununla birlikte","bu nedenle","bu yüzden","dahası","dolayısıyla","öte yandan","buna karşın","örneğin","sonuç olarak","kısacası","yine de","bu bağlamda","takdirde","sonunda","özellikle"];
function hlRegex(words){return new RegExp("(^|[^\\p{L}])("+[...words].sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?=[^\\p{L}]|$)","giu")}
const LINK_RE=hlRegex(LINKS);
const AWL_SET=new Set(AWL_WORDS);
const AWL_RE=new RegExp("(^|[^\\p{L}])(("+AWL_WORDS.slice().sort((a,b)=>b.length-a.length).join("|")+")(?:s|es|ed|d|ing|al|ly|ally|ation|ations)?)(?=[^\\p{L}]|$)","giu");
const TR_VERB_RE=/(^|[^\p{L}])(\p{L}+(?:abilir|ebilir|abilecek\p{L}*|ebilecek\p{L}*|malıdır|melidir|mektedir|maktadır|miştir|mıştır|muştur|müştür|ıyor|iyor|uyor|üyor|yor)\p{L}*)(?=[^\p{L}]|$)/giu;
const EN_VERB_RE=/(^|[^\p{L}])(can|could|may|might|should|must|will|need to|have to)(?=[^\p{L}]|$)/giu;
function glossOf(w){w=w.toLowerCase();if(GLOSS[w])return GLOSS[w];for(const suf of["s","es","ed","d","ing","ly","al"]){if(w.endsWith(suf)&&GLOSS[w.slice(0,-suf.length)])return GLOSS[w.slice(0,-suf.length)]}return null}
function baseAwl(w){w=w.toLowerCase();if(AWL_SET.has(w))return w;for(const suf of["ations","ation","ally","ing","ed","es","ly","al","s","d"]){if(w.endsWith(suf)&&AWL_SET.has(w.slice(0,-suf.length)))return w.slice(0,-suf.length)}return w}
function highlight(s,a,lang){
  let x=esc(s);const topic=ALL_TOPICS.find(t=>t.key===a.topicKey);
  const marks=[];const put=(re,cls,attr)=>{x=x.replace(re,(m,p,w)=>{marks.push(`<mark class="${cls}"${attr?attr(w):""}>${w}</mark>`);return p+"\u0000"+(marks.length-1)+"\u0001"})};
  if(topic){put(hlRegex(topic.terms.map(t=>lang==="tr"?t[0]:t[1].replace(/^the /,""))),"hl-term");put(hlRegex([lang==="tr"?topic.tr.toLocaleLowerCase("tr"):topic.en.replace(/^the /,""),lang==="tr"?topic.tr:cap(topic.en.replace(/^the /,""),"en")]),"hl-topic")}
  put(LINK_RE,"hl-link");
  if(lang==="en"&&L2!=="fr")put(AWL_RE,"hl-acad",w=>` data-w="${esc(baseAwl(w))}"`);
  put(lang==="tr"?TR_VERB_RE:EN_VERB_RE,"hl-verb");
  return x.replace(/\u0000(\d+)\u0001/g,(m,i)=>marks[+i]);
}

function legendFor(a){const on=colorOn();const tg=a.al?`<div class="actions cmode"><span class="note">Renklendirme:</span><button class="btn sm ${on?"primary":"ghost"}" data-cm="al">Yapı yapı eşleme</button><button class="btn sm ${on?"ghost":"primary"}" data-cm="hl">Konu & terim</button></div>`:"";

  <div class="grid" style="margin-bottom:8px"><select id="newLevel" class="control"><option value="1">Kolay</option><option value="2" selected>Orta</option><option value="3">Zor</option></select><select id="newTopic" class="control">${ALL_TOPICS.map(t=>`<option value="${t.key}">${t.tr}</option>`).join("")}</select></div>
  <div class="grid"><textarea id="newTr" class="answer" style="flex:1;min-width:260px" placeholder="Türkçe – her satıra bir cümle"></textarea><textarea id="newEn" class="answer" style="flex:1;min-width:260px" placeholder="English – one sentence per line"></textarea></div>
  <button id="addText" class="btn primary" style="margin-top:10px">Kütüphaneye ekle</button><div id="addMsg"></div>
  ${state.customTexts.length?`<h3>Eklediğin metinler</h3>${state.customTexts.map(t=>`<div class="actions"><span>${esc(t.title)} · ${t.tr.length} cümle</span><button class="btn ghost sm delCustom" data-id="${t.id}">Sil</button></div>`).join("")}`:""}`}
function syncView(){const cid=localStorage.getItem(CID_KEY)||"";return `<h2>Kayıt & Google Drive eşitleme</h2>
  <p><b>Tek bağlantı, iki kol:</b> Drive eşitlemesi Dersler kolunun (tamamlanan dersler, skorlar, kelime kasası) ilerlemesini de taşır.</p><p>İlerlemen her değişiklikte önce bu cihaza kaydedilir. Google Drive bağlandığında aynı kayıt Drive'ın gizli <b>uygulama veri klasörüne</b> yazılır; iPhone ve bilgisayarda aynı Google hesabıyla bağlanınca Done'lar ve skorlar birleştirilir.</p>
  <div class="result"><b>Durum:</b> <span id="syncInline">${esc($("#syncStatus").textContent)}</span>
  <div class="actions" style="margin-top:10px"><button class="btn primary" id="gConnect" ${cid?"":"disabled"}>${driveToken()?"🔄 Şimdi eşitle":"🔗 Google Drive'a bağlan"}</button>${driveToken()?`<button class="btn ghost" id="gDisconnect">Bağlantıyı kes</button>`:""}</div></div>
  <h3>Bir kerelik kurulum</h3>
  <label class="note">Google OAuth Client ID</label><input id="cid" class="control" style="width:100%" value="${esc(cid)}" placeholder="xxxxxxxx.apps.googleusercontent.com"><button class="btn ghost sm" id="saveCid" style="margin-top:6px">Kaydet</button>
  <ol class="note"><li>Uygulamayı <b>https</b> adresinde yayınla (ör. Netlify Drop, GitHub Pages). Google girişi <code>file://</code> ile açılan dosyada çalışmaz.</li>
  <li>Google Cloud Console → yeni proje → <b>Google Drive API</b>'yi etkinleştir.</li>
  <li>OAuth consent screen: External, kendi hesabını <b>Test user</b> olarak ekle; kapsam: <code>https://www.googleapis.com/auth/drive.appdata</code>.</li>
  <li>Credentials → OAuth client ID → <b>Web application</b>; Authorized JavaScript origins'e yayın adresini ekle.</li>
  <li>Client ID'yi yukarı yapıştır, kaydet, “Bağlan”a bas. Aynısını iPhone'daki ana ekran uygulamasında da bir kez yap.</li></ol>
  <h3>Yedek (Drive olmadan da çalışır)</h3>
  <div class="actions"><button class="btn ghost" id="exportBtn">⬇️ İlerlemeyi indir (JSON)</button><button class="btn ghost" id="importBtn">⬆️ Yedeği yükle / birleştir</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div>
  <h3>MTR okuma metinleri</h3><p class="note">Durum: <b>${MTR.length?MTR.length+" metin yüklü":"bu cihazda yok"}</b>. Kişisel MTR dosyanı (<code>mtr-content.js</code>) bu cihaza bir kez yükle. Metinler yalnızca bu cihazda saklanır; internete ya da siteye gönderilmez.</p><div class="actions"><button class="btn ghost" id="mtrBtn">📄 MTR dosyasını yükle</button>${localStorage.getItem("co.mtr")?'<button class="btn ghost sm" id="mtrDel">Bu cihazdan kaldır</button>':""}<input id="mtrFile" type="file" class="hidden"></div>`}

function render(){renderList();const a=cur();
  $("#content").innerHTML=currentTab==="learn"?learnView(a):currentTab==="full"?fullView(a):currentTab==="practice"?practiceView(a):currentTab==="words"?wordsView(a):currentTab==="library"?libraryView():syncView();
  bind(a)}
function bind(a){
  $$("[data-cm]").forEach(b=>b.onclick=()=>{state.settings.color=b.dataset.cm;saveState();render()});
  $$(".al").forEach(sp=>sp.onclick=e=>{e.stopPropagation();const box=sp.closest(".sentence[data-s]")||$("#content");const tr=box.querySelector(".translation");if(tr)tr.classList.remove("hidden");const k=sp.dataset.k;
    box.querySelectorAll(".al").forEach(x=>x.classList.toggle("on",x.dataset.k===k));const en=[...box.querySelectorAll('.al[data-l="en"]')].filter(x=>x.dataset.k===k).map(x=>x.textContent).join(" ");if(en)speak([en])});
  const r=$("#rate");if(r){r.value=String(state.settings.rate||0.85);r.onchange=()=>{state.settings.rate=+r.value;saveState()}}
  const la=$("#listenAll");if(la)la.onclick=()=>{const boxes=$$(".sentence[data-s]");speak(a.en,i=>{boxes.forEach(b=>b.classList.remove("speaking"));if(i>=0&&boxes[i]){boxes[i].classList.add("speaking");boxes[i].scrollIntoView({block:"nearest",behavior:"smooth"})}})};
  const sa=$("#stopAll");if(sa)sa.onclick=stopSpeak;
  $$(".listenOne").forEach(b=>b.onclick=e=>{e.stopPropagation();speak([a.en[+b.dataset.i]])});
  $$(".hl-acad").forEach(m=>m.onclick=e=>{e.stopPropagation();const w=m.dataset.w,g=glossOf(w);speak([w]);toast(`📘 ${w}${g?" — "+g:" (akademik kelime)"}`)});
  $$(".awl").forEach(m=>m.onclick=()=>speak([m.dataset.w]));
  $$(".sentence[data-s] a").forEach(x=>x.onclick=e=>e.stopPropagation());
  $$(".sentence[data-s]").forEach(x=>x.onclick=()=>x.querySelector(".translation").classList.toggle("hidden"));
  const ta=$("#toggleAll");if(ta)ta.onclick=()=>{const anyHidden=$$(".translation.hidden").length>0;$$(".translation").forEach(x=>x.classList.toggle("hidden",!anyHidden))};
  const db=$("#doneBtn");if(db)db.onclick=()=>{const it=item(a.id);if(it.done)return;it.done=true;it.doneAt=Date.now();touch(a.id);saveState();toast("✅ Done olarak kaydedildi");render()};
  const ub=$("#undoneBtn");if(ub)ub.onclick=()=>{const it=item(a.id);it.done=false;it.doneAt=null;touch(a.id);saveState();render()};
  if(currentTab==="practice"){
    $("#check").onclick=()=>checkSentence(a);const sr=$("#showRef");if(sr)sr.onclick=()=>{$("#feedback").innerHTML=`<div class="result"><b>Örnek çeviri</b><p>${esc(tgt(a)[practiceIdx])}</p></div>`};
    $("#prevS").onclick=()=>{practiceIdx--;render()};$("#nextS").onclick=()=>{practiceIdx++;render()};}
  if(currentTab==="library"){
    $("#addText").onclick=()=>{const tr=$("#newTr").value.split(/\n+/).map(s=>s.trim()).filter(Boolean),en=$("#newEn").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      if(tr.length<10||tr.length>50){$("#addMsg").innerHTML=`<p class="bad">Türkçe metin ${tr.length} cümle. 10–50 arası olmalı.</p>`;return}
      if(tr.length!==en.length){$("#addMsg").innerHTML=`<p class="bad">Satır sayıları eşleşmiyor: TR ${tr.length}, EN ${en.length}.</p>`;return}
      const tk=$("#newTopic").value,t=ALL_TOPICS.find(x=>x.key===tk);
      const txt={id:"u-"+Date.now().toString(36),topicKey:tk,topic:t.tr,level:+$("#newLevel").value,title:$("#newTitle").value.trim()||"Kullanıcı Metni",tr,en,origin:"Kullanıcı metni",col:"gen"};
      state.customTexts.unshift(txt);saveState();rebuild();selectedId=txt.id;currentTab="learn";setTab();render();toast("Metin eklendi")};
    $$(".delCustom").forEach(b=>b.onclick=()=>{if(!confirm("Bu metin silinsin mi?"))return;state.customTexts=state.customTexts.filter(t=>t.id!==b.dataset.id);saveState();rebuild();if(!corpus.find(x=>x.id===selectedId))selectedId=corpus[0].id;render()})}
  if(currentTab==="sync"){
    $("#saveCid").onclick=()=>{localStorage.setItem(CID_KEY,$("#cid").value.trim());initDrive();render();toast("Client ID kaydedildi")};
    $("#gConnect").onclick=()=>driveToken()?syncNow():connectDrive();
    const gd=$("#gDisconnect");if(gd)gd.onclick=()=>{try{google.accounts.oauth2.revoke(gAccess.token)}catch(e){}gAccess={token:null,exp:0};setSync("Drive bağlantısı kesildi · ilerleme bu cihazda");render()};
    $("#exportBtn").onclick=exportProgress;$("#mtrBtn").onclick=()=>$("#mtrFile").click();
    $("#mtrFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const t=String(r.result);const arr=JSON.parse(t.slice(t.indexOf("["),t.lastIndexOf("]")+1));if(!Array.isArray(arr)||!arr.length||!arr[0].en)throw 0;localStorage.setItem("co.mtr",JSON.stringify(arr));toast(arr.length+" MTR metni yüklendi");setTimeout(()=>location.reload(),900)}catch(err){toast("Dosya okunamadı — mtr-content.js dosyasını seç")}};r.readAsText(f)};
    const mdl=$("#mtrDel");if(mdl)mdl.onclick=()=>{localStorage.removeItem("co.mtr");location.reload()};$("#importBtn").onclick=()=>$("#importFile").click();$("#importFile").onchange=importProgress}
}

function norm(s,lang){return s.toLocaleLowerCase(lang).replace(/[’']/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu," ").split(/\s+/).filter(Boolean)}
function checkSentence(a){const ansRaw=$("#answer").value.trim();if(!ansRaw){toast("Önce çevirini yaz");return}
  const T=tgt(a),it=item(a.id);it.attempts++;it.sent=it.sent||{};
  if(!T){it.notes=it.notes||{};it.notes[practiceIdx]=ansRaw;touch(a.id);saveState();
    $("#feedback").innerHTML=`<div class="result"><b>Çevirin kaydedildi.</b><p class="note">Bu metnin hazır Türkçe çevirisi olmadığı için otomatik puan verilmez. Aslı ile kendi çevirini karşılaştır:</p><p><b>EN:</b> ${esc(a.en[practiceIdx])}</p><p><b>Senin:</b> ${esc(ansRaw)}</p><a class="btn ghost sm" target="_blank" rel="noopener" href="${bingUrl(a.en[practiceIdx])}">🌐 Çeviri motorunda karşılaştır</a></div>`;renderList();return}
  const lang=srcLang(a)==="tr"?"en":"tr",ref=T[practiceIdx],ans=norm(ansRaw,lang),refSet=new Set(norm(ref,lang)),ansSet=new Set(ans);
  const common=[...ansSet].filter(w=>refSet.has(w)).length,p=common/Math.max(ansSet.size,1),r=common/Math.max(refSet.size,1);
  const score=Math.round((p&&r?2*p*r/(p+r):0)*100);
  it.sent[practiceIdx]=Math.max(it.sent[practiceIdx]||0,score);
  it.best=Math.round(Object.values(it.sent).reduce((s,x)=>s+x,0)/a.en.length);touch(a.id);saveState();
  const diff=ref.split(/(\s+)/).map(tok=>{const w=norm(tok,lang)[0];return w?`<span class="${ansSet.has(w)?"tok-ok":"tok-miss"}">${esc(tok)}</span>`:tok}).join("");
  $("#feedback").innerHTML=`<div class="result"><div class="score ${score>=70?"good":"bad"}">${score}%</div><b>${score>=85?"Çok iyi":score>=70?"İyi":"Tekrar dene"}</b>
  <p class="note">Örnek çeviri — <span class="tok-ok">yeşil</span>: senin çevirinde var, <span class="tok-miss">kırmızı</span>: eksik. Eş anlamlı doğru kelimeler de kırmızı görünebilir; anlamı sen değerlendir.</p><p>${diff}</p>
  ${lang==="en"?`<button class="btn ghost sm listenOne" data-i="${practiceIdx}">🔊 Doğru telaffuzu dinle</button>`:""}
  <p class="note">Metin ilerlemesi: ${it.best}% (cümle skorlarının ortalaması)</p></div>`;
  $$("#feedback .listenOne").forEach(b=>b.onclick=()=>speak([a.en[+b.dataset.i]]));renderList()}

function updateStats(){const vals=Object.values(state.items).filter(x=>x.attempts>0),sc=vals.filter(x=>x.best>0);
  $("#sTotal").textContent=corpus.length;$("#sDone").textContent=Object.values(state.items).filter(x=>x.done).length;$("#sTried").textContent=vals.length;
  $("#sAvg").textContent=(sc.length?Math.round(sc.reduce((s,x)=>s+x.best,0)/sc.length):0)+"%";
  let n=0;const d=new Date();if(!state.days[today()])d.setDate(d.getDate()-1);
  while(true){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;if(state.days[k]){n++;d.setDate(d.getDate()-1)}else break}
  $("#sStreak").textContent=n}

function exportProgress(){const b=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download=`ceviriden-ogren-ilerleme-${today()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importProgress(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const inc=JSON.parse(r.result);if(inc.schema!==2)throw 0;state=mergeStates(state,inc);saveState();rebuild();render();toast("Yedek birleştirildi")}catch(err){toast("Geçersiz yedek dosyası")}};r.readAsText(f)}

/* 4) GOOGLE DRIVE EŞİTLEME (appDataFolder, drive.appdata) */
const CID_KEY="ceviridenOgren.gClientId",DRIVE_FILE="ceviriden-ogren-progress.json",SCOPE="https://www.googleapis.com/auth/drive.appdata";
let tokenClient=null,gAccess={token:null,exp:0},driveFileId=null,syncTimer=null,syncing=false;
const driveToken=()=>gAccess.token&&Date.now()<gAccess.exp-60000?gAccess.token:null;
function setSync(t){$("#syncStatus").textContent="☁️ "+t;const s=$("#syncInline");if(s)s.textContent="☁️ "+t}
function initDrive(){const cid=localStorage.getItem(CID_KEY);if(!cid)return;
  if(location.protocol==="file:"){setSync("Drive için uygulamayı https adresinden açın · ilerleme bu cihazda");return}
  const go=()=>{tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPE,callback:async r=>{if(r.error){setSync("Drive izni alınamadı: "+r.error);return}gAccess={token:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};localStorage.setItem("ceviridenOgren.gLinked","1");await syncNow();if(currentTab==="sync")render()}});
    setSync(localStorage.getItem("ceviridenOgren.gLinked")?"Drive'a yeniden bağlanmak için “Kayıt & Drive” → Bağlan":"Drive hazır · bağlanmak için “Kayıt & Drive” sekmesi")};
  if(window.google?.accounts?.oauth2)return go();
  const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=go;s.onerror=()=>setSync("Google kütüphanesi yüklenemedi (internet?) · ilerleme bu cihazda");document.head.appendChild(s)}
function connectDrive(){if(!tokenClient){toast("Önce Client ID'yi kaydedin ve uygulamayı https üzerinden açın");return}tokenClient.requestAccessToken({prompt:localStorage.getItem("ceviridenOgren.gLinked")?"":"consent"})}
async function gfetch(url,opt={}){const t=driveToken();if(!t)throw new Error("token");const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});if(!r.ok)throw new Error("Drive "+r.status);return r}
async function findFile(){if(driveFileId)return driveFileId;const q=encodeURIComponent(`name='${DRIVE_FILE}'`);
  const r=await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);const j=await r.json();driveFileId=j.files?.[0]?.id||null;return driveFileId}
async function pullRemote(){const id=await findFile();if(!id)return null;const r=await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);return r.json()}
async function pushRemote(data){const body=JSON.stringify(data);const id=await findFile();
  if(id){await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});return}
  const b="co"+Date.now(),meta={name:DRIVE_FILE,parents:["appDataFolder"],mimeType:"application/json"};
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp});driveFileId=(await r.json()).id}
async function syncNow(){if(syncing||!driveToken())return;syncing=true;setSync("Eşitleniyor…");
  try{const remote=await pullRemote();if(remote&&remote.schema===2)state=mergeStates(state,remote);foApply();state.updatedAt=Date.now();localStorage.setItem(LS_KEY,JSON.stringify(state));
    await pushRemote(state);rebuild();updateStats();renderList();setSync("Drive ile eşitlendi · "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}))}
  catch(e){setSync(e.message==="token"?"Drive oturumu doldu · tekrar bağlanın (ilerleme bu cihazda güvende)":"Eşitleme hatası: "+e.message+" · ilerleme bu cihazda güvende")}
  finally{syncing=false}}
function scheduleDriveSync(){if(!driveToken()){if(localStorage.getItem("ceviridenOgren.gLinked")&&tokenClient)setSync("Değişiklikler bu cihazda · Drive'a göndermek için yeniden bağlanın");return}clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()});

function setTab(){$$(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===currentTab))}
$("#lang2").value=L2;$("#lang2").onchange=e=>{try{localStorage.setItem("co.lang",e.target.value)}catch(x){}location.reload()};
if(L2==="fr"){const d=$("#direction");d.options[0].text="Türkçe → Fransızca";d.options[1].text="Fransızca → Türkçe";const hp=$(".hero p");if(hp)hp.textContent="Türkçe ↔ Fransızca: oku, dinle, çevir ve “Done” ile işaretle. Renkler aynı anlamı gösterir.";$$("#collection option").forEach(o=>{if(!["all","fra"].includes(o.value))o.hidden=true});document.documentElement.lang="tr"}
voaOpt();renderTopics();updateStats();render();initDrive();if(L2!=="fr")voaRefresh();
$("#collection").onchange=()=>{renderTopics();const f=filtered();if(f.length&&!f.find(a=>a.id===selectedId))selectedId=f[0].id;practiceIdx=0;stopSpeak();render()};
[$("#direction"),$("#level"),$("#topic"),$("#status")].forEach(x=>x.onchange=()=>{const f=filtered();if(f.length&&!f.find(a=>a.id===selectedId))selectedId=f[0].id;practiceIdx=0;stopSpeak();render()});
$("#search").oninput=renderList;
$("#randomBtn").onclick=()=>{const f=filtered();if(!f.length)return;selectedId=f[Math.floor(Math.random()*f.length)].id;practiceIdx=0;render()};
$("#nextTodoBtn").onclick=()=>{const f=filtered().filter(a=>!state.items[a.id]?.done);if(!f.length){toast("Bu filtrede öğrenilmemiş metin kalmadı 🎉");return}const i=f.findIndex(a=>a.id===selectedId);selectedId=f[(i+1)%f.length].id;practiceIdx=0;render()};
$$(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;setTab();stopSpeak();render()});

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}))}
